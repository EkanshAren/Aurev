# ==============================================================================
# GST Notice Copilot — Offline Privacy Profile (Local Ollama llama3.2 + MySQL 8)
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=offline
# ==============================================================================

# Disable cloud OpenAI / Groq provider completely in offline mode
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false

# Enable local Ollama inference engine on localhost:11434
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=when_missing

spring.ai.ollama.chat.enabled=true
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.15
spring.ai.ollama.chat.options.num-ctx=8192

# Local Ollama embeddings for MySQL cosine-similarity legal vector search
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text
