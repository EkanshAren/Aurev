# ==============================================================================
# GST Notice Copilot — Default Production/Dev Configuration (MySQL 8 + Groq AI)
# ==============================================================================
spring.application.name=gst-notice-copilot-backend
server.port=8080

# --- MySQL 8.x DataSource (Replaces PostgreSQL) ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:gst_notice_copilot}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate (MySQL 8 InnoDB Dialect) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# --- Schema & Legal Corpus Bootstrap ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# --- Multipart Upload Limits (PDF Notices + GSTR-2B / Purchase JSON) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# --- Spring AI: OpenAI-Compatible Endpoint (Groq Free Tier) ---
spring.ai.openai.base-url=${AI_OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:REPLACE_VIA_ENV_VAR}
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.15
spring.ai.openai.embedding.enabled=false

# Disable Ollama auto-config in online profile (enabled via --spring.profiles.active=offline)
spring.ai.ollama.chat.enabled=false
spring.ai.ollama.embedding.enabled=false

# --- CORS Allowed Origin for Member 3 CA Dashboard ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
